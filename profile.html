<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>My Profile - SocialConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>SocialConnect</h1>

        <div>

            <button onclick="goHome()">
                Home
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <main>

        <div class="profile-card">

            <h2>👤 My Profile</h2>

            <label>Name</label>

            <input
                type="text"
                id="profileName"
                placeholder="Your name"
            >


            <label>Email</label>

            <input
                type="email"
                id="profileEmail"
                disabled
            >


            <label>Bio</label>

            <textarea
                id="profileBio"
                placeholder="Write something about yourself..."
            ></textarea>


            <button onclick="updateProfile()">
                💾 Save Profile
            </button>

            <p id="profileMessage"></p>

        </div>

    </main>


    <script src="profile.js"></script>

</body>

</html>
